<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Articles - ArticleHub</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            background: var(--surface);
        }

        main {
            padding: 2rem 0 4rem;
        }

        .page-header {
            background: var(--background);
            border-bottom: 1px solid var(--border);
            padding: 2rem 0;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            font-size: 1.125rem;
            color: var(--text-secondary);
            font-family: var(--font-sans);
            font-weight: 400;
        }

        .create-section {
            margin-bottom: 3rem;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .articles-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .read-time {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.875rem;
        }
    </style>
</head>

<body>
    <nav>
        <div class="nav-container">
            <a href="/" class="nav-brand">ArticleHub</a>
            <div class="nav-actions">
                <button id="logoutBtn" class="btn btn-secondary btn-sm">Sign out</button>
            </div>
        </div>
    </nav>

    <div class="page-header">
        <div class="container">
            <h1 class="page-title">Your Stories</h1>
            <p class="page-subtitle">Write, edit, and share your articles</p>
        </div>
    </div>

    <main class="container">
        <section class="create-section">
            <div class="card">
                <h3 class="section-title">Write a new story</h3>
                <form id="createArticleForm">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" placeholder="Give your story a title..." required>
                    </div>
                    <div class="form-group">
                        <label for="content">Tell your story</label>
                        <textarea id="content" placeholder="Share your thoughts, ideas, and experiences..." rows="8"
                            required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg">Publish</button>
                </form>
            </div>
        </section>

        <section>
            <h2 class="section-title">
                Published Stories
                <span class="badge badge-primary" id="articleCount">0</span>
            </h2>
            <div id="articlesList" class="articles-list">
                <div class="card" style="text-align: center; padding: 3rem;">
                    <p class="text-muted">Loading your stories...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/user-dashboard.js"></script>
</body>

</html>
