<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ArticleHub</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            background: var(--surface);
        }

        main {
            padding: 2rem 0 4rem;
        }

        .page-header {
            background: var(--background);
            border-bottom: 1px solid var(--border);
            padding: 2rem 0;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            font-size: 1.125rem;
            color: var(--text-secondary);
            font-family: var(--font-sans);
            font-weight: 400;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #FEE2E2;
            color: #DC2626;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            margin-left: 1rem;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            font-family: var(--font-serif);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        .articles-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .table-container {
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
        }
    </style>
</head>

<body>
    <nav>
        <div class="nav-container">
            <a href="/" class="nav-brand">ArticleHub</a>
            <div class="nav-actions">
                <span class="admin-badge">🛡️ Admin</span>
                <button id="logoutBtn" class="btn btn-secondary btn-sm">Sign out</button>
            </div>
        </div>
    </nav>

    <div class="page-header">
        <div class="container">
            <h1 class="page-title">Admin Dashboard</h1>
            <p class="page-subtitle">Manage users and content across the platform</p>
        </div>
    </div>

    <main class="container">
        <section style="margin-bottom: 3rem;">
            <h2 class="section-title">
                Users
                <span class="badge badge-primary" id="userCount">0</span>
            </h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Joined</th>
                        </tr>
                    </thead>
                    <tbody id="usersList">
                        <tr>
                            <td colspan="4" style="text-align: center; padding: 2rem;">Loading users...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section>
            <h2 class="section-title">
                All Stories
                <span class="badge badge-primary" id="articleCount">0</span>
            </h2>
            <div id="articlesList" class="articles-list">
                <div class="card" style="text-align: center; padding: 3rem;">
                    <p class="text-muted">Loading stories...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/admin-dashboard.js"></script>
    <script>
        // Update counts
        const updateUserCount = () => {
            const rows = document.querySelectorAll('#usersList tr');
            const count = rows.length > 1 || (rows.length === 1 && !rows[0].querySelector('[colspan]')) ? rows.length : 0;
            document.getElementById('userCount').textContent = count;
        };

        const updateArticleCount = () => {
            const articles = document.querySelectorAll('.article-card');
            document.getElementById('articleCount').textContent = articles.length;
        };

        const observer = new MutationObserver(() => {
            updateUserCount();
            updateArticleCount();
        });

        observer.observe(document.getElementById('usersList'), { childList: true });
        observer.observe(document.getElementById('articlesList'), { childList: true });
    </script>
</body>

</html>
